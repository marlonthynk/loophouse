name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hosted runners have Chromium's system libraries; preflight verifies them.
      - run: npx playwright install chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
